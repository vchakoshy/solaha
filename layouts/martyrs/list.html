<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <title>شهدای ایران</title>
</head>

<body>
  <h1>فهرست شهدا</h1>

  {{ range .Pages }}
  <article>
    <img src="{{ .Params.image }}" width="200">
    <h2>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </h2>
    <p>{{ .Summary }}</p>
  </article>
  <hr>
  {{ end }}

</body>

</html>

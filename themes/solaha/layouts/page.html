{{ define "main" }}

<article class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow">
  <h1 class="text-2xl font-bold mb-2">{{ .Title }}</h1>

  {{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
  {{ $dateHuman := .Date | time.Format ":date_long" }}
  <time class="text-sm text-zinc-500" datetime="{{ $dateMachine }}">
    {{ $dateHuman }}
  </time>

  <div class="prose prose-zinc max-w-none mt-6">
    {{ .Content }}
  </div>

  <div class="mt-6">
    {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
  </div>
</article>

{{ end }}
